name: Build Release APK

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 缓存 Gradle 依赖
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 4. 授予 gradlew 执行权限
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5. 构建 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 6. 对齐 + 签名
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 7. Debug 输出签名文件（可选）
      - name: Debug signed APK
        run: echo "Signed file: ${{ steps.sign.outputs.signedReleaseFiles }}"

      # 8. 发布到 GitHub Releases（仅 tag 触发时）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign.outputs.signedReleaseFiles }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 上传 Artifact（手动触发或下载）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdtb-purify-${{ github.sha }}
          path: ${{ steps.sign.outputs.signedReleaseFiles }}
          retention-days: 7
